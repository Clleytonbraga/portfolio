<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Cleyton Braga</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bg:#0c0d10; --fg:#f2f3f5; --muted:#9aa0ac; --line:#23262e; --accent:#6cff8f; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .code{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(28px,6vw,44px);margin:12px 0 8px;line-height:1.1}
  p{color:var(--muted);margin:0 0 28px;max-width:46ch}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  a{display:inline-flex;padding:10px 18px;border:1px solid var(--line);border-radius:999px;
    color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;transition:border-color .15s,color .15s}
  a:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
  <main>
    <div class="code">Erro 404</div>
    <h1>Essa página não existe</h1>
    <p>O endereço pode ter mudado ou o conteúdo ainda não está publicado.</p>
    <div class="links">
      <a href="/">Início</a>
      <a href="/cases/cases-de-sucesso/">Ver os cases</a>
      <a href="/sobre/">Quem sou eu</a>
    </div>
  </main>
</body>
</html>
