<head>

<style>
  /* DOGGO DASH — releitura da cobrinha p/ a campanha São Braz · Pippo's Vitaminado.
     Arte original da campanha (Figma Resumo-2). Self-contained, sem libs. */
  :root{
    --field:#6fc2a9; --field2:#5bb299; --grass:#4ea588; --grass2:#3f9079;
    --caramel:#ec8d37; --ink:#1b1712; --dark:#20463d; --dark2:#16332c;
    --orange:#f2a03d; --orange-d:#d2781c; --stone:#8b9a94; --stone-d:#5c6b66;
  }
  *{ box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:#fff;
    background:radial-gradient(130% 100% at 50% 0%, #37705f 0%, var(--dark) 50%, var(--dark2) 100%);
    height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(6px,1.4vh,14px);
    padding:clamp(8px,2vh,18px) 12px; user-select:none;
  }
  /* bandeirolas discretas no topo */
  body::before{
    content:""; position:fixed; inset:0 0 auto 0; height:34px; z-index:0; opacity:.5; pointer-events:none;
    background:repeating-linear-gradient(90deg,#e23b3b 0 26px,transparent 26px 52px,#2f6fd0 52px 78px,transparent 78px 104px,var(--orange) 104px 130px,transparent 130px 156px);
    -webkit-mask:radial-gradient(12px 16px at 12px 0,#000 98%,transparent) repeat-x 0 0/26px 18px;
            mask:radial-gradient(12px 16px at 12px 0,#000 98%,transparent) repeat-x 0 0/26px 18px;
  }

  .topbar{ z-index:1; position:relative; display:flex; align-items:flex-start; justify-content:center;
    width:min(440px,96vw); min-height:clamp(70px,11.5vh,102px); }
  /* placar — mesma pílula do Pegue o Pippo's (arte 541:8713: saquinho na plaquinha dourada) */
  .pts{ position:absolute; left:0; top:clamp(4px,.8vh,10px); width:clamp(108px,15.5vh,132px); aspect-ratio:266/144;
    background:url(./assets/pill.webp) center/contain no-repeat; container-type:inline-size; }
  .pts #score{ position:absolute; left:47.7%; top:57%; transform:translateY(-50%); white-space:nowrap;
    font:500 15cqw/1 "Mitr",system-ui,sans-serif; color:#825d4c; }
  .pts #score.long{ font-size:11.5cqw; }
  /* cronômetro TEMPO (anel de pedra) */
  .tempo{ position:relative; width:clamp(70px,11.5vh,102px); aspect-ratio:1; margin-top:-6px; }
  .tempo img{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .tempo .tlabel{ position:absolute; left:0; right:0; top:29%; text-align:center; color:#fff;
    font-size:clamp(8px,1.5vh,11px); letter-spacing:2px; font-weight:bold; opacity:.95; }
  .tempo .tnum{ position:absolute; left:0; right:0; top:39%; text-align:center; color:#fff;
    font-size:clamp(22px,3.9vh,33px); font-weight:bold; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.28); }
  .tempo.low .tnum{ color:#ffcf6b; animation:tick .5s ease infinite; }
  @keyframes tick{ 50%{ transform:scale(1.12); } }

  /* arena + moldura de pedra */
  .stage{ z-index:1; flex:1; min-height:0; width:min(440px,96vw); display:grid; place-items:center; }
  /* moldura de pedra REAL do Figma (49:125722) via border-image 9-slice */
  .arena{
    position:relative; padding:0;
    border:clamp(17px,3.5vh,30px) solid transparent;
    border-image:url(./assets/stone-frame.webp) 110 129 round;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.42));
  }
  canvas{ display:block; border-radius:12px; background:var(--field); touch-action:none; }

  .brand{ z-index:1; height:clamp(40px,6.4vh,60px); width:auto; opacity:.96;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); }

  /* HOME idêntica (frame real do Figma, responsivo + letterbox) */
  .home{ position:fixed; inset:0; z-index:40; display:none; place-items:center;
    background:radial-gradient(130% 100% at 50% 0%, #3a6f5d 0%, #16332c 100%); padding:0; }
  .home.show{ display:grid; }
  .home .phone{ position:relative; aspect-ratio:580/1052; height:100%; max-height:100dvh;
    max-width:100vw; border-radius:20px; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.4); }
  .home .phone img{ width:100%; height:100%; object-fit:cover; display:block; }
  .home .jogar-hit{ position:absolute; left:5%; top:64.3%; width:90%; height:10.3%;
    border:0; background:transparent; cursor:pointer; border-radius:16px; }
  .home .jogar-hit:active{ background:rgba(0,0,0,.14); }

  /* LOADING idêntico ao Figma: anel do cão girando + logo DOGGO central */
  .loading{ position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:4vh;
    background:radial-gradient(130% 100% at 50% 40%, #3a6f5d 0%, #16332c 100%); }
  .loading.show{ display:flex; }
  .loadwrap{ position:relative; width:min(62vw,290px); aspect-ratio:1; display:grid; place-items:center; }
  .loadring{ position:absolute; inset:0; width:100%; height:100%;
    animation:spin 1.25s linear infinite; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .loadlogo{ position:relative; width:54%; height:auto; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loadtxt{ color:#cfe6d9; font-weight:bold; letter-spacing:3px; font-size:clamp(13px,2vh,16px); }
  .loadtxt .dots::after{ content:""; animation:dots 1.3s steps(1,end) infinite; }
  @keyframes dots{ 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }

  /* fim de jogo — mesmo padrão do Pegue o Pippo's (campanha São Braz · Pippo's):
     tela cheia marrom da marca, Mitr, painel "Sua pontuação é: xN", recorde e JOGAR NOVAMENTE */
  .overlay{ position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(132,66,45,.93);
    font-family:"Mitr",system-ui,sans-serif; }
  .overlay.show{ display:grid; }
  .overlay .col{ width:min(100vw, calc(100dvh*1080/1920)); container-type:inline-size; display:flex; flex-direction:column;
    align-items:center; gap:3.4cqw; padding:0 7cqw; text-align:center; }
  .overlay h2{ font-weight:500; font-size:10.4cqw; line-height:1; text-shadow:0 .5cqw 0 rgba(0,0,0,.35); }
  .overlay p{ font-weight:300; font-size:5.9cqw; line-height:1.25; }
  .overlay .panel{ width:94.6cqw; height:17cqw; border:.5cqw solid rgba(0,0,0,.18); border-radius:5cqw; background:rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center; gap:3cqw; }
  .overlay .panel img{ height:19cqw; margin-top:-2cqw; }
  .overlay .panel b{ font-weight:500; font-size:12.5cqw; line-height:1; text-shadow:0 .6cqw 0 #2b1a10; }
  .overlay .best{ font-size:3.5cqw; font-weight:400; opacity:.9; min-height:1em; }
  .btn{ width:85.9cqw; height:12.5cqw; border:0; border-radius:2.2cqw; background:#f78e33; color:#fff; cursor:pointer;
    font:600 4.95cqw "Mitr",sans-serif; text-transform:uppercase; text-shadow:0 .35cqw 0 #2b1a10;
    box-shadow:0 1.1cqw 0 #2b1a10; margin-top:1.5cqw; }
  .btn:active{ transform:translateY(.6cqw); box-shadow:0 .5cqw 0 #2b1a10; }
  .btn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="pts"><span id="score">x 00</span></div>
    <div class="tempo" id="tempoWrap"><img src="./assets/timer-ring.webp" alt=""><div class="tlabel">TEMPO</div><div class="tnum" id="tempo">30</div></div>
  </div>

  <div class="stage">
    <div class="arena" id="arena">
      <canvas id="cv"></canvas>


    </div>
  </div>

  <img class="brand" src="./assets/brand.webp" alt="São Braz · Pippo's Vitaminado">

  <!-- fora do .arena: o filter da moldura prenderia o position:fixed -->
  <div class="overlay" id="overO">
    <div class="col">
      <h2>Fim de jogo!</h2>
      <p>Sua pontuação é:</p>
      <div class="panel"><img src="./assets/food.webp" alt=""><b id="finalScore">x0</b></div>
      <p>Então, acha que consegue superar isso?</p>
      <div class="best" id="best"></div>
      <button class="btn" id="againBtn">Jogar novamente</button>
    </div>
  </div>

  <!-- LOADING idêntico ao Figma (49:129558): cão girando ao redor do logo DOGGO -->
  <div class="loading show" id="loadO">
    <div class="loadwrap">
      <img class="loadring" src="./assets/loader-ring.webp" alt="">
      <img class="loadlogo" src="./assets/loader-logo.webp" alt="DOGGO">
    </div>
    <div class="loadtxt">CARREGANDO<span class="dots"></span></div>
  </div>

  <!-- HOME idêntica ao Figma: frame real + área clicável sobre o botão JOGAR -->
  <div class="home" id="startO">
    <div class="phone">
      <img src="./assets/home.webp" alt="DOGGO — Desafio do mês" draggable="false">
      <button class="jogar-hit" id="startBtn" aria-label="Jogar"></button>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var COLS=12, ROWS=14;
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var arena=document.getElementById('arena'), stage=document.querySelector('.stage');
  // mesmo formato do Pegue o Pippo's: "x 05", "x 1.250"
  function setScore(n){ elScore.textContent='x '+(n<10?'0':'')+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); elScore.classList.toggle('long',n>=1000); }
  var elScore=document.getElementById('score'), elTempo=document.getElementById('tempo');
  var tempoWrap=document.getElementById('tempoWrap');
  var startO=document.getElementById('startO'), overO=document.getElementById('overO');
  var loadO=document.getElementById('loadO');
  var START_TIME=30, TIME_BONUS=3, TIME_CAP=45; // sistema de tempo (Figma TEMPO)
  var BIG_AT=9; // a partir deste tamanho o cão usa a cabeça "grande" (orelhas pra trás)
  var cell=20, dpr=Math.min(window.devicePixelRatio||1, 2);

  // assets
  function spr(src){ var i=new Image(); i.src=src; return i; }
  var imgHead=spr('./assets/head.webp'), imgHeadSmall=spr('./assets/head-small.webp'),
      imgBody=spr('./assets/body.webp'),
      imgCorner=spr('./assets/corner.webp'), imgTail=spr('./assets/tail.webp'),
      imgBulge=spr('./assets/bulge.webp'), imgLbulge=spr('./assets/lbulge.webp'),
      imgFood=spr('./assets/food.webp');
  var bg=null; // cached field background canvas

  // state
  var snake, dir, nextDir, food, score, speed, acc, last, running, dead, grow, bulges, timeLeft;
  var REC=0; try{ REC=parseInt(localStorage.getItem('doggo_score')||'0',10)||0; }catch(e){}

  function sizeCanvas(){
    var r=stage.getBoundingClientRect();
    var availW=Math.min(r.width, 440);
    // moldura de pedra = border do .arena; lê a espessura real pra encaixar o canvas
    var bw=parseFloat(getComputedStyle(arena).borderLeftWidth)||18;
    var frame=2*bw+6;
    var maxW=Math.min(availW, 440), maxH=r.height;
    var aw=maxW-frame, ah=maxH-frame;
    var w=Math.min(aw, ah*COLS/ROWS);
    w=Math.max(180, Math.floor(w));
    var h=Math.round(w*ROWS/COLS);
    cell=w/COLS;
    cv.style.width=w+'px'; cv.style.height=h+'px';
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    buildBG(w,h);
    draw();
  }

  function buildBG(w,h){
    bg=document.createElement('canvas'); bg.width=Math.round(w*dpr); bg.height=Math.round(h*dpr);
    var g=bg.getContext('2d'); g.scale(dpr,dpr);
    g.fillStyle='#6fc2a9'; g.fillRect(0,0,w,h);
    // grass blobs
    var blobs=[[0.18,0.12,0.9],[0.82,0.2,1.1],[0.7,0.62,1.0],[0.26,0.78,1.15],[0.5,0.42,0.8],[0.9,0.85,0.9],[0.08,0.5,0.8]];
    for(var i=0;i<blobs.length;i++){
      var bx=blobs[i][0]*w, by=blobs[i][1]*h, br=blobs[i][2]*w*0.17;
      var rg=g.createRadialGradient(bx,by,br*0.2,bx,by,br);
      rg.addColorStop(0,'rgba(78,165,136,.9)'); rg.addColorStop(1,'rgba(78,165,136,0)');
      g.fillStyle=rg; g.beginPath(); g.arc(bx,by,br,0,7); g.fill();
    }
    // faint paw prints
    g.fillStyle='rgba(60,130,108,.30)';
    var paws=[[0.33,0.3],[0.63,0.46],[0.2,0.6],[0.78,0.72],[0.46,0.84]];
    for(var p=0;p<paws.length;p++) paw(g, paws[p][0]*w, paws[p][1]*h, w*0.03);
  }
  function paw(g,x,y,s){
    g.save(); g.translate(x,y);
    g.beginPath(); g.ellipse(0,s*0.55,s*0.9,s*0.7,0,0,7); g.fill();
    var t=[[-0.8,-0.5],[-0.28,-0.95],[0.28,-0.95],[0.8,-0.5]];
    for(var i=0;i<4;i++){ g.beginPath(); g.ellipse(t[i][0]*s,t[i][1]*s,s*0.32,s*0.42,0,0,7); g.fill(); }
    g.restore();
  }

  function reset(){
    var cy=Math.floor(ROWS/2);
    snake=[{x:5,y:cy},{x:4,y:cy},{x:3,y:cy}];
    dir={x:1,y:0}; nextDir={x:1,y:0};
    score=0; speed=150; acc=0; last=0; grow=0; dead=false; bulges=[]; timeLeft=START_TIME;
    placeFood(); setScore(0); updateTempo();
  }
  function updateTempo(){
    var s=Math.max(0,Math.ceil(timeLeft)); elTempo.textContent=s;
    tempoWrap.classList.toggle('low', s<=10);
  }
  function placeFood(){
    var free=[];
    for(var y=0;y<ROWS;y++) for(var x=0;x<COLS;x++){
      var on=false; for(var i=0;i<snake.length;i++) if(snake[i].x===x&&snake[i].y===y){on=true;break;}
      if(!on) free.push({x:x,y:y});
    }
    food=free.length? free[(Math.random()*free.length)|0] : null;
  }

  function start(){
    startO.classList.remove('show'); overO.classList.remove('show');
    reset(); running=true; last=performance.now(); requestAnimationFrame(loop);
  }
  function gameOver(reason){
    running=false; dead=true;
    var novo=score>REC;
    if(novo){ REC=score; try{localStorage.setItem('doggo_score',String(REC));}catch(e){} }
    document.getElementById('finalScore').textContent='x'+String(score).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    document.getElementById('best').textContent=novo&&score>0?'Novo recorde!':(REC?'Seu recorde: x'+String(REC).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'');
    overO.classList.add('show');
  }

  function step(){
    dir=nextDir;
    var head=snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS){ return gameOver(); }
    for(var i=0;i<snake.length-1;i++) if(snake[i].x===nx&&snake[i].y===ny){ return gameOver(); }
    // salgadinho descendo pelo corpo: cada bolo avança 1 segmento/tick rumo ao rabo
    for(var k=0;k<bulges.length;k++) bulges[k]++;
    snake.unshift({x:nx,y:ny});
    if(food&&nx===food.x&&ny===food.y){
      score+=100; setScore(score); grow++; // +100 por Pippo's, mesma escala do Pegue o Pippo's
      if(speed>78) speed-=4;
      timeLeft=Math.min(TIME_CAP, timeLeft+TIME_BONUS); updateTempo(); // +tempo por Pippo's
      bulges.push(1);          // nasce logo atrás da cabeça
      placeFood();
    }
    if(grow>0) grow--; else snake.pop();
    bulges=bulges.filter(function(k){ return k>=1 && k<snake.length-1; }); // some ao chegar no rabo
  }

  function loop(t){
    if(!running) return;
    var dt=t-last; last=t; acc+=dt;
    timeLeft-=dt/1000;
    if(timeLeft<=0){ timeLeft=0; updateTempo(); return gameOver('tempo'); }
    while(acc>=speed){ acc-=speed; step(); if(!running){ draw(true); return; } }
    updateTempo(); draw();
    requestAnimationFrame(loop);
  }

  function draw(isDead){
    var w=cv.width/dpr, h=cv.height/dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(bg) ctx.drawImage(bg,0,0,w,h); else { ctx.fillStyle='#6fc2a9'; ctx.fillRect(0,0,w,h); }

    // food (gentle bob)
    if(food&&imgFood.complete){
      var fs=cell*1.28, bob=Math.sin(performance.now()/300)*cell*0.05;
      var fx=(food.x+0.5)*cell, fy=(food.y+0.5)*cell+bob;
      ctx.save(); ctx.translate(fx,fy); ctx.rotate(-0.25);
      ctx.shadowColor='rgba(0,0,0,.22)'; ctx.shadowBlur=cell*0.25; ctx.shadowOffsetY=cell*0.14;
      ctx.drawImage(imgFood, -fs/2, -fs/2, fs, fs*imgFood.height/imgFood.width);
      ctx.restore();
    }

    if(snake&&snake.length){
      // tile the REAL Figma sprites (head faces E, body opens E/W, tail opens E, corner opens N+W)
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      var n=snake.length;
      function sgn(v){ return v>0?1:(v<0?-1:0); }
      function blit(img,gx,gy,ang,scale){
        if(!img.complete||!img.naturalWidth) return;
        var s=cell*(scale||1);
        ctx.save(); ctx.translate((gx+0.5)*cell,(gy+0.5)*cell); ctx.rotate(ang);
        ctx.drawImage(img,-s/2,-s/2,s,s); ctx.restore();
      }
      function cornerAng(a,b){ // native corner opens N+W (=0)
        var hasN=(a.y<0||b.y<0), hasS=(a.y>0||b.y>0), hasE=(a.x>0||b.x>0), hasW=(a.x<0||b.x<0);
        if(hasN&&hasW) return 0;
        if(hasN&&hasE) return Math.PI/2;
        if(hasS&&hasE) return Math.PI;
        return -Math.PI/2; // S+W
      }
      var bset={}; for(var bi=0;bi<bulges.length;bi++) bset[bulges[bi]]=1;
      // draw tail→body first, head last (on top)
      for(var i=n-1;i>=1;i--){
        var c=snake[i], pa=snake[i-1];
        if(i===n-1){ // tail (opens toward body)
          var t={x:sgn(pa.x-c.x),y:sgn(pa.y-c.y)};
          blit(imgTail,c.x,c.y,Math.atan2(t.y,t.x),1);
        } else {
          var pb=snake[i+1];
          var a={x:sgn(pa.x-c.x),y:sgn(pa.y-c.y)};   // toward head
          var b={x:sgn(pb.x-c.x),y:sgn(pb.y-c.y)};   // toward tail
          var bulged=bset[i];
          if(a.x===-b.x&&a.y===-b.y)                 // straight
            blit(bulged?imgBulge:imgBody, c.x,c.y, (a.y!==0?Math.PI/2:0), 1);
          else                                       // corner (lbulge opens N+E = corner-90°)
            blit(bulged?imgLbulge:imgCorner, c.x,c.y, cornerAng(a,b)-(bulged?Math.PI/2:0), 1);
        }
      }
      var hd=snake[0], h={x:sgn(hd.x-snake[1].x),y:sgn(hd.y-snake[1].y)};
      var headImg = n<BIG_AT ? imgHeadSmall : imgHead; // orelhas pra cima (pequeno) / pra trás (grande)
      blit(headImg,hd.x,hd.y,Math.atan2(h.y,h.x),1.34);
    }
  }

  // input
  function setDir(x,y){
    if(!running) return;
    if(x===-dir.x&&y===-dir.y) return; // no 180º
    nextDir={x:x,y:y};
  }
  window.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase())>=0) e.preventDefault();
    if(k==='arrowup'||k==='w') setDir(0,-1);
    else if(k==='arrowdown'||k==='s') setDir(0,1);
    else if(k==='arrowleft'||k==='a') setDir(-1,0);
    else if(k==='arrowright'||k==='d') setDir(1,0);
    else if(k==='r'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); start(); } // R = recomeçar (Cmd/Ctrl+R = reload do navegador)
    else if(k===' '){ if(!running&&startO.classList.contains('show')) start(); }
  }, {passive:false});

  // swipe
  var tsx=0,tsy=0,tracking=false;
  function tStart(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tracking=true; }
  function tMove(e){
    if(!tracking) return; var t=e.touches[0];
    var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)<22&&Math.abs(dy)<22) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
    tsx=t.clientX; tsy=t.clientY; e.preventDefault();
  }
  cv.addEventListener('touchstart',tStart,{passive:true});
  cv.addEventListener('touchmove',tMove,{passive:false});
  cv.addEventListener('touchend',function(){tracking=false;},{passive:true});

  document.getElementById('startBtn').addEventListener('click',start);
  document.getElementById('againBtn').addEventListener('click',start);

  window.addEventListener('resize',sizeCanvas);
  var ro=new ResizeObserver(sizeCanvas); ro.observe(stage);
  // loader: some quando os sprites carregam + tempo mínimo (sensação de "carregando servidor")
  var ASSETS=[imgHead,imgHeadSmall,imgBody,imgCorner,imgTail,imgBulge,imgLbulge,imgFood];
  var loaded=0, minReady=false;
  function reveal(){ if(minReady && loaded>=ASSETS.length){ loadO.classList.remove('show'); startO.classList.add('show'); } }
  ASSETS.forEach(function(im){
    function done(){ draw(); loaded++; reveal(); }
    if(im.complete && im.naturalWidth){ draw(); loaded++; }
    else { im.onload=done; im.onerror=done; }
  });
  setTimeout(function(){ minReady=true; reveal(); }, 1600);
  reveal();
  sizeCanvas();
})();
</script>
</body>
</html>
